<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dagg P4R6 — equal-viewport peer comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #171714; color: #f1efe8; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(1880px, calc(100% - 48px)); margin: 0 auto; padding: 40px 0 64px; }
    h1 { max-width: 820px; margin: 0 0 12px; font-size: clamp(28px, 4vw, 54px); letter-spacing: -0.04em; }
    p { max-width: 780px; margin: 0 0 36px; color: #b9b7af; }
    .choice { display: flex; flex-wrap: wrap; gap: 10px; margin: -12px 0 36px; }
    .choice a { border: 1px solid #4a4841; padding: 10px 14px; color: #f1efe8; text-decoration: none; }
    .choice a:hover, .choice a:focus-visible { border-color: #c96f4a; color: #f0a27e; outline: none; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    figure { margin: 0; border: 1px solid #3a3934; background: #24231f; }
    img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; }
    figcaption { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
    .dagg { border-color: #c96f4a; }
    .dagg figcaption { color: #f0a27e; }
    .dagg > a { display: block; color: inherit; text-decoration: none; }
    .dagg > a:hover img, .dagg > a:focus-visible img { opacity: 0.88; }
    .dagg > a:focus-visible { outline: 2px solid #f0a27e; outline-offset: 4px; }
    @media (min-width: 1500px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 760px) { main { width: min(100% - 24px, 1880px); padding-top: 24px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Equal-viewport comparison</h1>
    <p>Current peer captures and the three resolved Dagg Home directions, all inspected from the same first-screen perspective. This is review evidence, not a public route.</p>
    <nav class="choice" aria-label="Open an interactive Dagg direction">
      <a href="../../../preview/golden-standard/directions/a1/">Open A1</a>
      <a href="../../../preview/golden-standard/directions/b1/">Open B1</a>
      <a href="../../../preview/golden-standard/directions/c1/">Open C1</a>
    </nav>
    <div class="grid">
      <figure><img src="../../P4R4/peer-anthropic-live-1440.png" alt="Anthropic homepage reference at 1440 pixels"><figcaption><span>Peer</span><strong>Anthropic</strong></figcaption></figure>
      <figure><img src="../../P4R4/peer-xai-live-1440.png" alt="xAI homepage reference at 1440 pixels"><figcaption><span>Peer</span><strong>xAI</strong></figcaption></figure>
      <figure><img src="../../P4R4/peer-palantir-live-1440.png" alt="Palantir homepage reference at 1440 pixels"><figcaption><span>Peer</span><strong>Palantir</strong></figcaption></figure>
      <figure><img src="../../P4R4/peer-openai-live-1440.png" alt="OpenAI homepage reference at 1440 pixels"><figcaption><span>Peer</span><strong>OpenAI</strong></figcaption></figure>
      <figure class="dagg"><a href="../../../preview/golden-standard/directions/a1/"><img src="a1-desktop-1440x900.png" alt="Dagg direction A1 at 1440 by 900 pixels"><figcaption><span>Dagg</span><strong>A1 — Strategic editorial</strong></figcaption></a></figure>
      <figure class="dagg"><a href="../../../preview/golden-standard/directions/b1/"><img src="b1-desktop-1440x900.png" alt="Dagg direction B1 at 1440 by 900 pixels"><figcaption><span>Dagg</span><strong>B1 — Living system</strong></figcaption></a></figure>
      <figure class="dagg"><a href="../../../preview/golden-standard/directions/c1/"><img src="c1-desktop-1440x900.png" alt="Dagg direction C1 at 1440 by 900 pixels"><figcaption><span>Dagg</span><strong>C1 — Accountable control</strong></figcaption></a></figure>
    </div>
  </main>
</body>
</html>
