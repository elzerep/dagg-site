<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dagg P4R8 first-screen peer comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #171714; color: #f6f2e9; font: 14px/1.4 Arial, sans-serif; }
    h1 { margin: 0 0 18px; font-size: 22px; font-weight: 500; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    figure { margin: 0; padding: 10px; background: #2a2924; border: 1px solid #4a483f; }
    figcaption { margin: 0 0 8px; font-weight: 600; letter-spacing: .04em; }
    img { display: block; width: 100%; aspect-ratio: 1265 / 720; object-fit: contain; object-position: top; background: #fff; }
  </style>
</head>
<body>
  <h1>First-screen comparison · captured 1280-class desktop viewport</h1>
  <div class="grid">
    <figure><figcaption>Dagg P4R8R1</figcaption><img src="dagg-home-r1-1280-first.png" alt="Dagg Home first screen after visible-quality repair"></figure>
    <figure><figcaption>Anthropic</figcaption><img src="../P4R4/peer-anthropic-live-1440.png" alt="Anthropic Home first screen"></figure>
    <figure><figcaption>SpaceXAI / xAI</figcaption><img src="../P4R4/peer-xai-live-1440.png" alt="xAI Home first screen"></figure>
    <figure><figcaption>OpenAI</figcaption><img src="../P4R4/peer-openai-live-1440.png" alt="OpenAI Home first screen"></figure>
  </div>
</body>
</html>
