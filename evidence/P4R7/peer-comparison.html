<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P4R7 A2 peer comparison</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #242422; color: #f0eee6; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 28px; }
    h1 { margin: 0 0 24px; font-size: 22px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 10px; color: rgb(240 238 230 / .72); font-size: 13px; }
    img { display: block; width: 100%; height: auto; border: 1px solid rgb(240 238 230 / .22); }
    .dagg { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <h1>A2 first-screen comparison · same evidence set</h1>
  <div class="grid">
    <figure class="dagg"><figcaption>Dagg A2 · 1280 × 720</figcaption><img src="/evidence/P4R7/a2-desktop-1280x720.png" alt="Dagg A2 first screen"></figure>
    <figure><figcaption>Anthropic · first viewport</figcaption><img src="/evidence/P4R4/peer-anthropic-live-1440.png" alt="Anthropic homepage first viewport"></figure>
    <figure><figcaption>xAI · first viewport</figcaption><img src="/evidence/P4R4/peer-xai-live-1440.png" alt="xAI homepage first viewport"></figure>
    <figure><figcaption>OpenAI · first viewport</figcaption><img src="/evidence/P4R4/peer-openai-live-1440.png" alt="OpenAI homepage first viewport"></figure>
    <figure><figcaption>Palantir · first viewport</figcaption><img src="/evidence/P4R4/peer-palantir-live-1440.png" alt="Palantir homepage first viewport"></figure>
  </div>
</body>
</html>
