<head>

<title>A · The Instrument — Dagg</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Newsreader:opsz,wght@6..72,300..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">

<style>
/* A — THE INSTRUMENT. The map is the hero. It runs, and you can step it. */
.hero{min-height:min(100svh,1000px);display:grid;align-items:center;
  padding:var(--space-8) 0 var(--space-7)}
.hero .w{display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr);
  gap:clamp(2rem,4vw,4.5rem);align-items:center}
.hero h1{font-size:clamp(2.25rem,3.6vw,3.4rem);line-height:1.02;letter-spacing:-.036em;
  font-weight:400;max-width:19ch;margin:.7rem 0 1.2rem}
.hero .lead{max-width:38ch}
.cta{display:flex;gap:.75rem;margin-top:2rem;flex-wrap:wrap}

/* the instrument */
.inst{background:var(--surface-instrument);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 0 color-mix(in srgb,var(--color-ink) 12%,transparent),
             0 30px 60px -30px color-mix(in srgb,var(--color-ink) 40%,transparent)}
.inst__bar{display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;
  border-bottom:1px solid rgba(240,238,230,.1)}
.inst__dot{width:7px;height:7px;border-radius:50%;background:rgba(240,238,230,.22)}
.inst__name{font-family:var(--font-instrument);font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(240,238,230,.5);margin-left:.4rem}
.inst__state{margin-left:auto;font-family:var(--font-instrument);font-size:11.5px;
  letter-spacing:.14em;color:var(--color-clay)}
.inst__body{padding:1.1rem 1.1rem 1.3rem}
.steps{display:flex;gap:.35rem;padding:0 1.1rem 1rem}
.step{flex:1;border:0;color:rgba(240,238,230,.55);background:none;padding:.65rem .3rem;cursor:pointer;
  font-family:var(--font-instrument);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  border-top:2px solid rgba(240,238,230,.2);
  transition:color .3s ease,border-color .3s ease}
.step[aria-selected="true"]{color:var(--color-paper);border-top-color:var(--color-clay);border-top-width:2px}
.step:hover{color:rgba(240,238,230,.8)}
.inst svg{width:100%;height:auto;display:block}
/* below the fold width the instrument keeps its legible size and scrolls,
   rather than shrinking its labels to six pixels */
@media(max-width:760px){
  .inst__body{overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-right:0;scrollbar-width:thin}
  .inst svg{width:560px;max-width:none}
  .inst__hint{display:block}
}
.inst__hint{display:none;font-family:var(--font-instrument);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:rgba(240,238,230,.45);padding:0 1.1rem .9rem}
.g-node rect{fill:#221F1D;stroke:rgba(240,238,230,.4);stroke-width:1}
.g-node text{font-family:var(--font-instrument);font-size:11.5px;letter-spacing:.09em;fill:rgba(240,238,230,.82)}
.g-edge{fill:none;stroke:rgba(240,238,230,.34);stroke-width:1.2}
.g-lit rect{stroke:var(--color-clay);stroke-width:1.5}
.g-lit text{fill:var(--color-paper)}
.g-lit-edge{stroke:var(--color-clay);stroke-width:1.6;stroke-opacity:.95}
.g-human rect{stroke:var(--color-clay);stroke-dasharray:4 3}
.g-fade{opacity:.34;transition:opacity .45s ease}
.g-on{opacity:1}
.inst__cap{font-family:var(--font-human);font-size:16px;line-height:1.55;
  color:rgba(240,238,230,.78);padding:0 1.1rem 1.2rem;max-width:52ch}

.sec--thesis{background:var(--color-paper-lift);padding:var(--section-block) 0 calc(var(--section-block) * .6)}
.thesis{font-size:var(--type-h2);line-height:1.04;letter-spacing:-.036em;font-weight:400;
  max-width:20ch;margin:.9rem 0 var(--space-6)}
.thesis em{font-style:normal;color:var(--color-clay-deep)}
.tsplit{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,3vw,3.5rem);max-width:1000px}
@media(max-width:900px){.tsplit{grid-template-columns:1fr}}

/* section 2 — the decision, as the instrument's own output */
.sec{padding:var(--section-block) 0}
.sec--panel{background:var(--color-panel)}
.hd{max-width:26ch;margin-bottom:var(--space-7)}
.hd h2{font-size:var(--type-h2);line-height:var(--leading-heading);letter-spacing:-.032em;font-weight:400}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule-subtle);
  border:1px solid var(--rule-subtle);border-radius:12px;overflow:hidden}
.five>div{background:var(--surface-page);padding:1.4rem 1.2rem 1.6rem;min-height:220px;
  transition:background .3s ease}
.five>div:hover{background:var(--surface-raised)}
.five h3{font-size:1.0625rem;font-weight:500;letter-spacing:-.02em;margin-bottom:.6rem}
.five p{font-family:var(--font-human);font-size:.9375rem;line-height:1.6;color:var(--text-secondary)}
.five .n{font-family:var(--font-instrument);font-size:10px;letter-spacing:.14em;
  color:var(--text-muted);display:block;margin-bottom:1rem}
.five .built{color:var(--color-clay-deep)}
@media(max-width:1000px){.five{grid-template-columns:repeat(2,1fr)}}

.ld{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(2rem,4vw,4rem);
  align-items:start}
.led{border:1px solid var(--rule-subtle);border-radius:12px;overflow:hidden;background:var(--color-night)}
.led__h{display:flex;align-items:center;gap:.7rem;padding:.85rem 1.1rem;
  border-bottom:1px solid rgba(240,238,230,.1);font-family:var(--font-instrument);
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(240,238,230,.5)}
.led__live{margin-left:auto;color:var(--color-clay);display:flex;align-items:center;gap:.45rem}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--color-clay)}
.lrow{display:grid;grid-template-columns:66px 1fr auto;gap:1rem;align-items:baseline;
  padding:.9rem 1.1rem;border-bottom:1px solid rgba(240,238,230,.07);opacity:0;transform:translateY(6px)}
.lrow.in{opacity:1;transform:none;transition:opacity .5s ease-out,transform .5s ease-out}
.lrow.hum{background:rgba(217,119,87,.1)}
.lrow .t{font-family:var(--font-instrument);font-size:11.5px;color:rgba(240,238,230,.4)}
.lrow .d{font-family:var(--font-human);font-size:15.5px;line-height:1.45;color:rgba(240,238,230,.88)}
.lrow .d b{color:var(--color-paper);font-weight:600}
.lrow .k{font-family:var(--font-instrument);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;padding:.42em .8em;border-radius:5px;white-space:nowrap}
.k--sys{background:rgba(124,132,113,.34);color:#C3CCB8}
.k--hum{background:var(--color-clay);color:#241009;font-weight:500}
.led__f{padding:.95rem 1.1rem;font-family:var(--font-human);font-size:14px;
  color:rgba(240,238,230,.55);border-top:1px solid rgba(240,238,230,.1)}
@media(max-width:1000px){.ld{grid-template-columns:1fr}}
@media(max-width:640px){.lrow{grid-template-columns:1fr;gap:.35rem}.lrow .k{justify-self:start}}

/* the human beat runs on ink; coral carries a surface, not a hairline */
.sec--ink{background:var(--color-night);color:var(--color-paper)}
.sec--ink .eyebrow{color:rgba(240,238,230,.45)}
.sec--ink h2{color:var(--color-paper)}
.sec--ink .tx{color:rgba(240,238,230,.7)}
.sec--ink .tx b{color:var(--color-paper)}
.sec--ink .gate{border-color:rgba(240,238,230,.12)}
.sec--ink .gate__t{color:var(--color-paper)}
.sec--ink .gate p{color:rgba(240,238,230,.62)}
.sec--ink .btn--ghost{border-color:rgba(240,238,230,.28);color:var(--color-paper)}
.sec--human{background:var(--color-paper-lift)}
.hb{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(2rem,4vw,4.5rem);
  align-items:center}
.hb h2{font-size:var(--type-h3);line-height:1.1;letter-spacing:-.03em;font-weight:400;
  max-width:18ch;margin-top:.8rem}
.hb img{border-radius:14px;width:100%;height:auto}
.hb figcaption{font-family:var(--font-human);font-size:13.5px;line-height:1.5;
  color:var(--text-muted);margin-top:.9rem;max-width:52ch}
@media(max-width:1000px){.hb{grid-template-columns:1fr}}
.claim{background:var(--color-clay);color:#241009;border-radius:14px;
  padding:clamp(1.6rem,3vw,2.4rem);margin-top:var(--space-7)}
.claim p{font-family:var(--font-human);font-size:clamp(1.25rem,2.2vw,1.75rem);
  line-height:1.32;max-width:30ch;margin:0}
.claim p b{font-weight:600}
.claim .k{font-family:var(--font-instrument);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(36,16,9,.62);display:block;margin-bottom:.9rem}

.scale{margin-bottom:var(--space-7)}
.scale__track{height:2px;background:var(--rule-subtle);position:relative;border-radius:2px}
.scale__fill{position:absolute;left:0;top:0;height:2px;background:var(--color-clay);
  border-radius:2px;width:10%;transition:width .45s cubic-bezier(.16,1,.3,1)}
.scale__stops{display:grid;grid-template-columns:repeat(5,1fr);margin-top:-6px}
.stop{background:none;border:0;padding:0 0 0 0;cursor:pointer;text-align:left;
  font-family:var(--font-instrument);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-muted);display:flex;flex-direction:column;gap:.7rem;
  transition:color .3s ease}
.stop .dot{width:10px;height:10px;border-radius:50%;background:var(--color-panel-strong);
  border:2px solid var(--surface-page);transition:background .3s ease,transform .3s ease}
.stop[aria-selected="true"]{color:var(--text-primary)}
.stop[aria-selected="true"] .dot{background:var(--color-clay);transform:scale(1.25)}
.stop:hover{color:var(--text-primary)}
.scale__ends{display:flex;justify-content:space-between;margin-top:1.1rem;
  font-family:var(--font-human);font-size:14px;color:var(--text-muted)}
.case{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(2rem,4vw,4rem);
  background:var(--surface-page);border-radius:14px;padding:clamp(1.6rem,3vw,2.4rem);
  min-height:230px}
.case h3{font-size:clamp(1.5rem,2.6vw,2rem);font-weight:400;letter-spacing:-.03em;margin:.7rem 0 .9rem}
.case .mi{font-family:var(--font-instrument);font-size:11.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:.5rem}
.case p{font-size:1rem}
.case__l,.case__r{transition:opacity .3s ease}
.case.swap .case__l,.case.swap .case__r{opacity:0}
@media(max-width:900px){.case{grid-template-columns:1fr}
  .scale__stops{grid-template-columns:repeat(3,1fr);gap:1rem}}

/* section 3 — human control points */
.ctrl{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(2rem,4vw,4rem)}
.gate{display:grid;grid-template-columns:auto 1fr;gap:1.1rem;padding:1.3rem 0;
  border-bottom:1px solid var(--rule-subtle);align-items:start}
.gate:first-of-type{border-top:1px solid var(--rule-subtle)}
.gate__t{font-size:1.0625rem;font-weight:500;letter-spacing:-.018em}
.gate p{font-family:var(--font-human);font-size:.9375rem;line-height:1.62;color:var(--text-secondary);margin-top:.35rem}
@media(max-width:1000px){.ctrl,.hero .w{grid-template-columns:1fr}}
@media(max-width:700px){
  .hero{min-height:auto;padding:var(--space-7) 0}
  .steps{flex-wrap:wrap}.step{flex:0 0 calc(33.333% - .24rem)}
}
